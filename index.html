<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GeoLocate — Konum &amp; Ağ İstihbaratı</title>
<meta name="description" content="Tam ekran 3B harita: adres ya da koordinat ara, Google Maps bağlantısı yapıştır, ölç, kaydet, paylaş. IP adresinin operatörünü ve yaklaşık konumunu gör.">
<meta name="theme-color" content="#050a12">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="assets/css/hud.css">
</head>
<body>
<div id="map" aria-label="3B harita"></div>
<div class="fx" aria-hidden="true"></div>
<div class="xh xh-v" id="xh-v" aria-hidden="true"></div>
<div class="xh xh-h" id="xh-h" aria-hidden="true"></div>
<div class="xh xh-tag" id="xh-tag" aria-hidden="true"></div>

<header class="top">
  <a class="brand glass" href="./" aria-label="GeoLocate"><img src="assets/img/favicon.svg" alt=""><b>Geo<span>Locate</span></b></a>
  <form class="search glass" id="search" role="search" autocomplete="off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <label class="visually-hidden" for="q" style="position:absolute;left:-9999px">Ara</label>
    <input id="q" type="search" enterkeyhint="search" placeholder="Adres, koordinat ya da Google Maps bağlantısı…">
    <button class="btn gold" type="submit">Bul</button>
  </form>
  <nav class="nav glass" aria-label="Menü">
    <button class="btn" type="button" id="ip-open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01"/></svg><span>IP</span></button>
    <a class="btn" href="araclar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg><span>Araçlar</span></a>
    <a class="btn" href="araclar.html#hiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span>Hız testi</span></a>
    <a class="btn" href="hakkinda.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span>Hakkında</span></a>
  </nav>
</header>
<ul class="results glass" id="results" hidden></ul>

<section class="panel glass hide" id="panel" aria-live="polite">
  <div class="label" id="p-src">Hedef</div>
  <div class="coord" id="p-coord">—</div>
  <div class="addr" id="p-addr"></div>
  <div class="env" id="p-env" aria-live="polite"></div>
  <div class="rows" id="p-rows"></div>
  <div class="actions">
    <button class="btn" type="button" id="a-share">Paylaş</button>
    <button class="btn" type="button" id="a-save">Kaydet</button>
    <a class="btn" id="a-osm" target="_blank" rel="noopener">OpenStreetMap</a>
    <a class="btn" id="a-gm" target="_blank" rel="noopener">Google Maps</a>
  </div>
</section>

<div class="dock glass" aria-label="Harita araçları">
  <button class="btn" type="button" id="d-locate" title="Konumum" aria-label="Konumum"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <button class="btn" type="button" id="d-3d" title="3B görünüm" aria-label="3B görünüm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12 4 7.5M12 12l8-4.5M12 12v9"/></svg></button>
  <button class="btn" type="button" id="d-sat" title="Uydu" aria-label="Uydu görünümü"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
  <button class="btn" type="button" id="d-globe" title="Dünya" aria-label="Dünya görünümü"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></button>
  <button class="btn" type="button" id="d-measure" title="Mesafe ölç" aria-label="Mesafe ölç"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg></button>
</div>

<div class="readout glass" id="readout"><span>ENL <b id="r-lat">—</b></span><span>BOY <b id="r-lng">—</b></span><span>ZOOM <b id="r-z">—</b></span><span id="r-m"></span></div>

<aside class="drawer glass" id="drawer" aria-label="IP analizi" aria-hidden="true">
  <button class="btn close" type="button" id="ip-close" aria-label="Kapat">✕</button>
  <div class="label">Ağ istihbaratı</div>
  <h2>IP Analizi</h2>
  <form class="ipq" id="ipq"><input id="ip-in" placeholder="8.8.8.8 ya da boş bırak" inputmode="text" autocomplete="off"><button class="btn gold" type="submit">Sorgula</button></form>
  <div id="ip-out"></div>
  <p style="margin-top:16px;font-size:12px;color:var(--t3)">Ayrıntılı tablo için <a href="ip.html">IP Analizi sayfası</a>. IP konumu yaklaşıktır (şehir düzeyi).</p>
</aside>

<div class="intro" id="intro">
  <div class="log" id="log" hidden></div>
</div>
<button class="btn skip" type="button" id="skip">Geç ›</button>

<script src="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/geo.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
